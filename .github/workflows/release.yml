name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc,x86_64-pc-windows-msvc

      - name: Build installer (3 artifacts)
        shell: bash
        run: bash scripts/build-installer.sh

      - name: List delivery dir
        shell: bash
        run: ls -l target/delivery/

      - name: Upload artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: windows-delivery
          path: |
            target/delivery/XDelta3WrapFactory.dll
            target/delivery/xdelta.exe
            target/delivery/xdelta3-installer.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/delivery/XDelta3WrapFactory.dll
            target/delivery/xdelta.exe
            target/delivery/xdelta3-installer.exe
