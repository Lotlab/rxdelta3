[package]
name = "xdelta3-wrap"
version = "0.1.0"
edition = "2021"
description = "Drop-in replacement for XDelta3WrapFactory.dll (FFXIV V3 launcher), built on rxdelta"
license = "MIT OR Apache-2.0"

[lib]
name = "xdelta3_wrap"
crate-type = ["cdylib"]

[dependencies]
rxdelta = { path = ".." }
quick-xml = "0.37"

[dev-dependencies]
tempfile = "3"
